<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fondo -->
  <rect width="1200" height="630" fill="#0F0805"/>

  <!-- Círculos decorativos de fondo -->
  <circle cx="150"  cy="315" r="220" fill="#1E1008" opacity="0.6"/>
  <circle cx="1050" cy="315" r="220" fill="#1E1008" opacity="0.6"/>

  <!-- Card central -->
  <rect x="320" y="60" width="560" height="510" rx="20" fill="#1E1008" stroke="rgba(184,115,51,0.35)" stroke-width="1.5"/>
  <rect x="320" y="60" width="560" height="5"   rx="2.5" fill="#B87333"/>

  <!-- Mini campo de juego -->
  <rect x="400" y="130" width="440" height="180" rx="8" fill="#150A04"/>
  <!-- Raqueta arriba -->
  <rect x="460" y="148" width="80" height="11" rx="5" fill="#7A5228"/>
  <!-- Raqueta abajo -->
  <rect x="620" y="278" width="80" height="11" rx="5" fill="#C4842C"/>
  <!-- Pelota -->
  <circle cx="580" cy="210" r="12" fill="#ECD5A0"/>
  <!-- Línea central campo -->
  <line x1="420" y1="213" x2="820" y2="213" stroke="#3A2010" stroke-width="1" stroke-dasharray="6,8"/>

  <!-- Nombre marca -->
  <text x="600" y="365" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="bold" text-anchor="middle" fill="#B87333">Café Aurora</text>

  <!-- Banner descuento -->
  <rect x="410" y="390" width="380" height="96" rx="12" fill="rgba(184,115,51,0.1)" stroke="rgba(184,115,51,0.35)" stroke-width="1"/>
  <text x="600" y="447" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="900" text-anchor="middle" fill="#D4944A">10%</text>
  <text x="600" y="472" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#8C6B47" letter-spacing="3">DE DESCUENTO</text>

  <!-- Tagline -->
  <text x="600" y="530" font-family="Arial, Helvetica, sans-serif" font-size="18" text-anchor="middle" fill="#ECD5A0">Demuestra tu habilidad y gana tu cupón</text>

  <!-- Firma -->
  <text x="600" y="600" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#4A2E14">Demo creada por S Quetzal Digital</text>
</svg>
